name: Build Android and Windows applications
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['native/**','app/**','assets/**','package.json','package-lock.json','app-sw.js','.github/workflows/build-apps.yml']
  workflow_dispatch:
concurrency:
  group: application-installers-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Keep the Android install signing identity between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: absensi-android-install-key-v1
      - name: Build teacher and student Android apps
        working-directory: native/android
        run: gradle assembleDosenDebug assembleMahasiswaDebug --no-daemon
      - name: Name APK installers
        run: |
          mkdir -p installers
          cp native/android/app/build/outputs/apk/dosen/debug/*.apk installers/Absensi-Dosen-Android.apk
          cp native/android/app/build/outputs/apk/mahasiswa/debug/*.apk installers/Absen-Mahasiswa-Android.apk
      - name: Verify offline APK contents and upgrade signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download aplikasi-1.0.0 --pattern '*.apk' --dir previous-installers
          signers=("$ANDROID_HOME"/build-tools/*/apksigner)
          python3 scripts/verify-apk-upgrade.py "${signers[-1]}"
      - name: Keep APK installers
        uses: actions/upload-artifact@v4
        with:
          name: Android-Absensi-Dosen-dan-Mahasiswa
          path: installers/*.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run windows
      - name: Verify bundled Windows application
        run: node scripts/verify-windows-bundle.cjs
      - name: Keep Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Absensi-Dosen
          path: dist/windows/*.exe
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish application installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="aplikasi-$version"
          (cd installers && sha256sum *.apk *.exe) > installers/SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "Aplikasi Absensi $version" --notes-file docs/APLIKASI.md
          fi
