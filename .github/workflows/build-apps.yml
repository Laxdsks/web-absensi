name: Build Android and Windows applications
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['native/**','app/**','assets/**','package.json','package-lock.json','app-sw.js','.github/workflows/build-apps.yml']
  workflow_dispatch:
concurrency:
  group: application-installers-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Load the existing Android installation signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ('KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Original APK 1.0.0 signing key is required. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repository secrets. Existing installations must not be uninstalled.')
          path = Path(os.environ['RUNNER_TEMP']) / 'absensi-install.keystore'
          with path.open('xb') as output:
              os.chmod(path, 0o600)
              output.write(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('WA_ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
          PY
      - name: Build teacher and student Android apps
        working-directory: native/android
        env:
          WA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDosenDebug assembleMahasiswaDebug --no-daemon
      - name: Name APK installers
        run: |
          mkdir -p installers
          cp native/android/app/build/outputs/apk/dosen/debug/*.apk installers/Absensi-Dosen-Android.apk
          cp native/android/app/build/outputs/apk/mahasiswa/debug/*.apk installers/Absen-Mahasiswa-Android.apk
      - name: Verify offline APK contents and upgrade signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download aplikasi-1.0.0 --pattern '*.apk' --dir previous-installers
          signers=("$ANDROID_HOME"/build-tools/*/apksigner)
          python3 scripts/verify-apk-upgrade.py "${signers[-1]}"
      - name: Keep APK installers
        uses: actions/upload-artifact@v4
        with:
          name: Android-Absensi-Dosen-dan-Mahasiswa
          path: installers/*.apk
          if-no-files-found: error
      - name: Remove temporary Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/absensi-install.keystore"
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run windows
      - name: Verify bundled Windows application
        run: node scripts/verify-windows-bundle.cjs
      - name: Keep Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Absensi-Dosen
          path: dist/windows/*.exe
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish application installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="aplikasi-$version"
          (cd installers && sha256sum *.apk *.exe) > installers/SHA256SUMS.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            gh release create "$tag" installers/* --target "$GITHUB_SHA" --title "Aplikasi Absensi $version" --notes-file docs/APLIKASI.md
          fi
