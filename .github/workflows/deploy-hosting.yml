name: Publish PHP application to hosting

on:
  push:
    branches: [main]
    paths:
      - '*.php'
      - '!koneksi.php'
      - 'assets/**'
      - 'app/**'
      - 'app-sw.js'
      - 'scripts/deploy_hosting.py'
      - 'scripts/verify_hosting.py'
      - '.github/workflows/deploy-hosting.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-hosting-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read application revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
      - name: Check deployment manifest
        run: python3 scripts/deploy_hosting.py --dry-run
      - name: Check credential rotation verification
        run: python3 -m unittest discover -s tests -p 'test_verify_hosting.py'
      - name: Record existing data identities before deployment
        run: python3 scripts/verify_hosting.py --record-baseline "$RUNNER_TEMP/attendance-baseline.json"
      - name: Detect application payload changes
        id: payload
        env:
          WA_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines())
          verification = {'scripts/verify_hosting.py', 'tests/test_verify_hosting.py', '.github/workflows/deploy-hosting.yml'}
          same_payload = os.environ['WA_EVENT_NAME'] == 'push' and bool(changed) and changed <= verification
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + ('false' if same_payload else 'true') + '\n')
          print('Application payload unchanged; run full live verification.' if same_payload else 'Application payload requires installation.')
          PYTHON
      - name: Install application files on existing PHP hosting
        if: steps.payload.outputs.changed != 'false'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.FTP_DIRECTORY }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_USE_INFINITYFREE_ACCOUNT: 'true'
        run: python3 scripts/deploy_hosting.py
      - name: Verify application and teacher access on live hosting
        run: python3 scripts/verify_hosting.py --preserve-baseline "$RUNNER_TEMP/attendance-baseline.json"
      - name: Prepare browser login verification
        run: |
          npm install --prefix "$RUNNER_TEMP/login-browser" --no-save playwright@1.56.1
          "$RUNNER_TEMP/login-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify actual browser login on live hosting
        env:
          WA_PLAYWRIGHT_PATH: ${{ runner.temp }}/login-browser/node_modules/playwright
        run: node scripts/check_hosting_login.cjs
      - name: Remove temporary verification baseline
        if: always()
        run: rm -f "$RUNNER_TEMP/attendance-baseline.json"
