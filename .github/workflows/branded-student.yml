name: Build account-branded student APKs
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish PHP application to hosting']
    types: [completed]
  pull_request:
    paths: ['app_branding.php', 'app/teacher-branding.js', 'native/android/app/build.gradle', 'scripts/branding_worker.py', 'scripts/prepare_branded_assets.py', '.github/workflows/branded-student.yml']
permissions:
  contents: read
concurrency:
  group: presen-branded-${{ github.event_name == 'pull_request' && github.ref || 'worker' }}
  cancel-in-progress: false
jobs:
  fixture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 -m pip install Pillow cryptography
      - name: Build and verify a real branded APK with isolated fixtures
        run: python3 tests/build_branded_fixture.py
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test actual custom APK launch and signed upgrade
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none -memory 1536 -cores 2 -skin 480x800
          script: python3 tests/test_branded_launch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branded-apk-fixture-validation
          path: tests/results/branded-apk/
          retention-days: 7
  worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 -m pip install Pillow cryptography
      - name: Build the next requested student package
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIRECTORY: ${{ secrets.FTP_DIRECTORY }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_USE_INFINITYFREE_ACCOUNT: 'true'
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/branding_worker.py
